[package]
name = "m60-core"
description = "Edifier M60 BLE protocol, device state and connection logic (no UI, no Bluetooth backend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt", "macros", "time", "sync"] }
