[package]
name = "m60-tray"
description = "System-tray controller for the Edifier M60 speakers (Windows and macOS), built with Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "m60-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
m60-core = { path = "../m60-core" }
tauri = { version = "2", features = ["tray-icon"] }
btleplug = "0.13"
tokio = { version = "1", features = ["time", "sync", "macros"] }
futures-util = "0.3"
auto-launch = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = { version = "0.4", features = ["std"] }
