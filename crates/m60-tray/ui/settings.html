<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <h1>Settings</h1>
  </header>
  <main>
    <section aria-labelledby="app-heading">
      <h2 id="app-heading">App</h2>
      <label class="row">
        <span class="text"><span class="label">Start at login</span></span>
        <input type="checkbox" role="switch" data-app="startAtLogin">
      </label>
      <label class="row">
        <span class="text">
          <span class="label">Share the speaker with other devices</span>
          <span class="desc">Connect only when needed, so the phone app or another computer can use the speaker in between.</span>
        </span>
        <input type="checkbox" role="switch" data-app="share">
      </label>
      <label class="row">
        <span class="text">
          <span class="label">Remember volume for each input</span>
          <span class="desc">Switching to AUX or USB brings back the level it was last left at.</span>
        </span>
        <input type="checkbox" role="switch" data-app="rememberVolume">
      </label>
      <label class="row">
        <span class="text">
          <span class="label">Turn off into Bluetooth</span>
          <span class="desc">When you turn the speaker off from the app, it switches to Bluetooth first, so the app can reach it when it is turned back on. The app then switches back to the input you were using.</span>
          <span class="note" id="resume" hidden></span>
        </span>
        <input type="checkbox" role="switch" data-app="bluetoothOnPowerOff">
      </label>
    </section>

    <section aria-labelledby="speaker-heading" id="speaker">
      <h2 id="speaker-heading">Speaker</h2>
      <p class="note" id="speaker-note" hidden>Connect the speaker to change these.</p>
      <fieldset class="choice">
        <legend>Backlight duration</legend>
        <div class="segmented" id="durations"></div>
      </fieldset>
      <fieldset class="choice">
        <legend>Backlight sensitivity</legend>
        <div class="segmented" id="sensitivities"></div>
      </fieldset>
      <label class="row">
        <span class="text">
          <span class="label">Bluetooth connection tone</span>
          <span class="desc">The tone the speaker plays when a Bluetooth device connects.</span>
        </span>
        <input type="checkbox" role="switch" id="tone">
      </label>
    </section>
    <section aria-labelledby="about-heading">
      <h2 id="about-heading">About</h2>
      <dl class="about">
        <dt>Speaker</dt><dd id="model">Not connected</dd>
        <dt>Firmware</dt><dd id="firmware">-</dd>
        <dt>App version</dt><dd id="app-version">-</dd>
        <dt>Built</dt><dd id="build-time">-</dd>
      </dl>
    </section>
    <p id="message" role="status"></p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
