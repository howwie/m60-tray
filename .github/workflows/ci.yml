name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Tauri CLI
        if: runner.os != 'Linux'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Bundle
        if: runner.os != 'Linux'
        working-directory: crates/m60-tray
        run: cargo tauri build
      - name: Artifact name
        if: runner.os != 'Linux'
        id: artifact
        shell: bash
        run: echo "name=m60-tray-$RUNNER_OS-$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"   # e.g. m60-tray-macos-arm64
      - name: Upload installers
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app

  ui-pages:
    name: popup and EQ editor pages
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: crates/m60-tray/ui-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/m60-tray/ui-tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Publishes the installers as a GitHub release once everything above passes on main,
  # tagged v<version> from [workspace.package]. A version that already has a release is
  # skipped, so a new release appears only after the version is bumped.
  release:
    name: release
    needs: [check, ui-pages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "m60-tray") | .version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists; bump the version in Cargo.toml for a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.version.outputs.exists == 'false'
        with:
          pattern: m60-tray-*
          path: artifacts
      - name: Create release
        if: steps.version.outputs.exists == 'false'
        run: |
          mapfile -d '' files < <(find artifacts \( -name '*.msi' -o -name '*.dmg' -o -path '*/nsis/*.exe' \) -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then echo "No installers found"; exit 1; fi
          printf 'Attaching %s\n' "${files[@]}"
          gh release create "${{ steps.version.outputs.tag }}" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "M60 Tray ${{ steps.version.outputs.tag }}" \
            --generate-notes
